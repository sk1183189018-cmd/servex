packages:
  - "apps/*"
  - "packages/*"

# pnpm 10 blocks dependency install scripts unless listed here.
onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver

# Security: pin transitive packages that Next.js bundles to patched versions.
# Remove an entry once Next itself depends on a patched release.
overrides:
  postcss: ">=8.5.23"
  sharp: ">=0.35.5"
